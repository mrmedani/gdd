<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - GDD</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #334155; }
        .offline-card { text-align: center; padding: 2rem; }
        .offline-card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .offline-card p { color: #64748b; }
    </style>
</head>
<body>
    <div class="offline-card">
        <h1>📡 Vous êtes hors ligne</h1>
        <p>Veuillez vérifier votre connexion internet et réessayer.</p>
        <button onclick="window.location.reload()">Réessayer</button>
    </div>
</body>
</html>
