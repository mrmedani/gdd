<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Hors ligne - Chronorex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .radar-ping { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
        .floating { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center text-slate-200 relative">
    
    <!-- Animated Background Elements -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="glass-panel rounded-3xl p-10 max-w-sm w-full mx-4 text-center floating shadow-2xl relative z-10">
        
        <!-- Offline Icon with Radar Ping -->
        <div class="relative w-24 h-24 mx-auto mb-8">
            <div class="absolute inset-0 bg-slate-700/50 rounded-full radar-ping"></div>
            <div class="absolute inset-0 bg-slate-700/50 rounded-full radar-ping" style="animation-delay: 1s;"></div>
            <div class="relative w-full h-full bg-slate-800 rounded-full flex items-center justify-center border border-slate-600 shadow-inner z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18m-3.414-3.414A10.956 10.956 0 0112 21c-2.88 0-5.503-1.096-7.5-2.9m13.086-4.502c.677-.82 1.258-1.722 1.724-2.697M7.53 11.231c-.347.46-.662.946-.94 1.455M10.828 7.172A10.956 10.956 0 0112 3c2.88 0 5.503 1.096 7.5 2.9M5.414 5.414A10.956 10.956 0 003 12c0 2.214.656 4.28 1.77 6.015" />
                </svg>
            </div>
        </div>

        <h1 class="text-2xl font-bold text-white mb-3">Connexion Perdue</h1>
        <p class="text-slate-400 text-sm mb-8 leading-relaxed">
            Il semble que vous soyez hors ligne. L'application se reconnectera automatiquement dès le retour du réseau.
        </p>

        <button onclick="window.location.reload()" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg hover:shadow-blue-500/25">
            Réessayer maintenant
        </button>
    </div>

    <script>
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
