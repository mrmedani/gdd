<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Hors ligne - Chronorex</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .bg-orb {
            position: absolute;
            width: 24rem; height: 24rem;
            border-radius: 9999px;
            filter: blur(100px);
            opacity: 0.3;
            animation: pulse 4s ease-in-out infinite;
        }
        .orb-1 { top: -10%; left: -10%; background: #2563eb; }
        .orb-2 { bottom: -10%; right: -10%; background: #7c3aed; animation-delay: 2s; }
        @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.45; } }
        .panel {
            position: relative;
            z-index: 10;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 24rem;
            width: calc(100% - 2rem);
            margin: 0 1rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .radar { position: absolute; inset: 0; border-radius: 9999px; background: rgba(100,116,139,0.5); animation: ping 2s cubic-bezier(0,0,0.2,1) infinite; }
        @keyframes ping { 75%,100% { transform: scale(2); opacity: 0; } }
        .icon-wrap {
            position: relative; width: 6rem; height: 6rem; margin: 0 auto 2rem;
        }
        .icon-inner {
            position: absolute; inset: 0; border-radius: 9999px; background: #1e293b;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #475569; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); z-index: 10;
        }
        h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.75rem; }
        p { color: #94a3b8; font-size: 0.875rem; line-height: 1.6; margin-bottom: 2rem; }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #4f46e5);
            color: #fff; font-weight: 600;
            padding: 0.75rem 1.5rem; border: none; border-radius: 0.75rem;
            cursor: pointer; font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: scale(1.02); box-shadow: 0 10px 25px -5px rgba(59,130,246,0.4); }
        .btn:active { transform: scale(0.98); }
        .hint { margin-top: 1rem; font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="panel">
        <div class="icon-wrap">
            <div class="radar"></div>
            <div class="radar" style="animation-delay: 1s;"></div>
            <div class="icon-inner">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="#94a3b8" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18m-3.414-3.414A10.956 10.956 0 0112 21c-2.88 0-5.503-1.096-7.5-2.9m13.086-4.502c.677-.82 1.258-1.722 1.724-2.697M7.53 11.231c-.347.46-.662.946-.94 1.455M10.828 7.172A10.956 10.956 0 0112 3c2.88 0 5.503 1.096 7.5 2.9M5.414 5.414A10.956 10.956 0 003 12c0 2.214.656 4.28 1.77 6.015" />
                </svg>
            </div>
        </div>

        <h1>Connexion Perdue</h1>
        <p>
            Il semble que vous soyez hors ligne.<br>
            Chronorex est une application en ligne : vos données nécessitent une connexion.<br>
            La page se reconnectera automatiquement dès le retour du réseau.
        </p>

        <button class="btn" onclick="window.location.reload()">Réessayer maintenant</button>
        <p class="hint">Vérifiez votre connexion internet puis réessayez.</p>
    </div>

    <script>
        window.addEventListener('online', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
